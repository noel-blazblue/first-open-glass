plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.glass.dining.glass"
    compileSdk 34

    defaultConfig {
        applicationId "com.glass.dining.glass"
        minSdk 28
        targetSdk 28
        versionCode 6
        versionName "0.1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                "**/libc++_shared.so",
                "**/libjingle_peerconnection_so.so",
            ]
        }
    }
}

dependencies {
    implementation project(":link-api")
    implementation project(":shared")
    implementation("com.rokid.cxr:cxr-service-bridge:1.0-20260522.063600-105")
    implementation("io.getstream:stream-webrtc-android:1.3.10")
}

def resolveGlassSerial = {
    def listed = new ByteArrayOutputStream()
    exec {
        commandLine "adb", "devices", "-l"
        standardOutput = listed
        ignoreExitValue = true
    }
    def lines = listed.toString().readLines().findAll { it.contains(" device ") || it.contains("\tdevice") }
    def env = System.getenv("GLASS_SERIAL")
    if (env) {
        if (!lines.any { it.startsWith(env + " ") || it.startsWith(env + "\t") }) {
            throw new GradleException("GLASS_SERIAL=$env 不在 adb devices -l 里。眼镜未出现时必须停止，禁止改走手机或 CXR 安装。")
        }
        return env
    }
    def glasses = lines.findAll { it.contains("model:RG_glasses") }.collect { it.split("\\s+")[0] }
    if (glasses.size() == 1) return glasses[0]
    if (glasses.isEmpty()) {
        throw new GradleException("adb devices -l 里没有 model:RG_glasses。眼镜未连接时必须停止，禁止通过手机/CXR 安装。")
    }
    throw new GradleException("找到多副 RG_glasses: ${glasses.join(', ')}。请设置 GLASS_SERIAL。")
}

tasks.register("installGlassAdb") {
    group = "install"
    description = "Install the glasses CustomApp onto the unique RG_glasses over ADB only"
    dependsOn "assembleDebug"
    doLast {
        def serial = resolveGlassSerial()
        def apkDir = file("$buildDir/outputs/apk/debug")
        def apk = apkDir.listFiles()?.find { it.name.endsWith(".apk") && !it.name.contains("androidTest") }
        if (apk == null || !apk.exists()) {
            throw new GradleException("missing debug apk in $apkDir")
        }
        logger.lifecycle("installGlassAdb serial=$serial apk=${apk.name}")
        exec {
            commandLine "adb", "-s", serial, "uninstall", "com.glass.nav.glass"
            ignoreExitValue = true
        }
        exec {
            commandLine "adb", "-s", serial, "install", "-r", apk.absolutePath
        }
        def pkg = android.defaultConfig.applicationId
        [
            "android.permission.CAMERA",
            "android.permission.RECORD_AUDIO",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.WRITE_SECURE_SETTINGS",
        ].each { perm ->
            exec {
                commandLine "adb", "-s", serial, "shell", "pm", "grant", pkg, perm
                ignoreExitValue = true
            }
        }
        def dumpsys = new ByteArrayOutputStream()
        exec {
            commandLine "adb", "-s", serial, "shell", "dumpsys", "package", pkg
            standardOutput = dumpsys
        }
        def text = dumpsys.toString()
        def versionName = android.defaultConfig.versionName.toString()
        def versionCode = android.defaultConfig.versionCode.toString()
        if (!text.contains("versionName=$versionName") || !text.contains("versionCode=$versionCode ")) {
            throw new GradleException("眼镜包核验失败 serial=$serial 期望 versionName=$versionName versionCode=$versionCode")
        }
        logger.lifecycle("installGlassAdb ok $pkg versionName=$versionName versionCode=$versionCode")
    }
}

